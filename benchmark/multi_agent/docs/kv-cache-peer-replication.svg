<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#e65100"/></marker>
    <marker id="arr-ob" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ef6c00" opacity="0.5"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#757575"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7b1fa2"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c62828"/></marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1565c0"/></marker>
    <marker id="arr-gn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e7d32"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#fafafa"/>

  <!-- Title -->
  <text x="800" y="28" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a237e">KV Cache Peer Replication: DP=2, PP=2, TP=1 Data Transfer</text>
  <text x="800" y="50" text-anchor="middle" font-size="11" fill="#616161">Rows = PP stages, Columns = DP replicas. All replication arrows run horizontally (same PP, next DP). No PP-to-PP replication.</text>

  <!-- Head Server -->
  <rect x="400" y="62" width="800" height="42" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="800" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Head Server: TokenizerManager + DataParallelController</text>
  <text x="800" y="96" text-anchor="middle" font-size="9" fill="#7b1fa2">HTTP :28000 | Request dispatch | Checkpoint &amp; visible state tracking | Internal failover orchestration</text>

  <!-- Column headers -->
  <text x="370" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242">DP Replica 0</text>
  <text x="1230" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242">DP Replica 1 (backup for DP0)</text>

  <!-- Row labels -->
  <text x="16" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#9e9e9e" transform="rotate(-90 16 280)">PP Stage 0</text>
  <text x="16" y="560" text-anchor="middle" font-size="12" font-weight="bold" fill="#9e9e9e" transform="rotate(-90 16 560)">PP Stage 1</text>

  <!-- Dispatch arrows -->
  <line x1="600" y1="104" x2="370" y2="142" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="460" y="118" text-anchor="middle" font-size="9" fill="#7b1fa2" font-weight="bold">dispatch</text>
  <line x1="1000" y1="104" x2="1230" y2="142" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="1140" y="118" text-anchor="middle" font-size="9" fill="#7b1fa2" font-weight="bold">dispatch / failover</text>

  <!-- ============================================================ -->
  <!-- PP0 ROW: y=145 to y=380                                     -->
  <!-- ============================================================ -->

  <!-- DP0 / PP0 — Stage (0,0,0) -->
  <rect x="40" y="145" width="660" height="235" rx="8" fill="#fafafa" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="40" y="145" width="660" height="22" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="370" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Stage (0,0,0) — scheduler_DP0_PP0</text>

  <rect x="55" y="175" width="630" height="26" rx="4" fill="#dcedc8" stroke="#558b2f" stroke-width="1"/>
  <text x="370" y="193" text-anchor="middle" font-size="10" fill="#33691e">L1: GPU VRAM (KV Pool)  →  L2: Host DRAM (HiCache backup_thread)</text>

  <rect x="55" y="209" width="630" height="22" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="370" y="224" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">DecodeKVReplicator: on_decode_step → flush_page → GPU DMA → write_storage</text>

  <rect x="55" y="239" width="630" height="28" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="370" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">SEND ▸  PeerCacheClient → TCP → Stage(1,0,0) :29002</text>

  <rect x="55" y="275" width="630" height="28" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="370" y="294" text-anchor="middle" font-size="10" fill="#e65100">RECV ◂  PeerCacheServer :29000 ← Stage(1,0,0)  |  PeerRadixBuffer</text>

  <text x="370" y="322" text-anchor="middle" font-size="9" fill="#757575" font-family="Courier New, monospace">shard_rank=(0×2+0)×1+0=0 | port=29000</text>

  <rect x="55" y="334" width="630" height="36" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="0.5"/>
  <text x="65" y="349" font-size="9" fill="#424242"><tspan font-weight="bold">Prefill:</tspan> L1→L2→backup_thread→batch_set_v1(full_token_ids)→TCP</text>
  <text x="65" y="363" font-size="9" fill="#1565c0"><tspan font-weight="bold">Decode:</tspan> on_decode_step→flush→DMA→write_storage(full_token_ids)→TCP</text>

  <!-- DP1 / PP0 — Stage (1,0,0) -->
  <rect x="900" y="145" width="660" height="235" rx="8" fill="#fafafa" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="900" y="145" width="660" height="22" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1230" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Stage (1,0,0) — scheduler_DP1_PP0</text>

  <rect x="915" y="175" width="630" height="26" rx="4" fill="#dcedc8" stroke="#558b2f" stroke-width="1"/>
  <text x="1230" y="193" text-anchor="middle" font-size="10" fill="#33691e">L1: GPU VRAM (KV Pool)  →  L2: Host DRAM (HiCache backup_thread)</text>

  <rect x="915" y="209" width="630" height="22" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="1230" y="224" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">DecodeKVReplicator: on_decode_step → flush_page → GPU DMA → write_storage</text>

  <rect x="915" y="239" width="630" height="28" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="1230" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">SEND ▸  PeerCacheClient → TCP → Stage(0,0,0) :29000</text>

  <rect x="915" y="275" width="630" height="28" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="1230" y="294" text-anchor="middle" font-size="10" fill="#e65100">RECV ◂  PeerCacheServer :29002 ← Stage(0,0,0)  |  PeerRadixBuffer</text>

  <text x="1230" y="322" text-anchor="middle" font-size="9" fill="#757575" font-family="Courier New, monospace">shard_rank=(1×2+0)×1+0=2 | port=29002</text>

  <rect x="915" y="334" width="630" height="36" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="0.5"/>
  <text x="925" y="349" font-size="9" fill="#c62828" font-weight="bold">On DP0 failover: prefetch DP0/PP0 KV from local PeerRadixBuffer</text>
  <text x="925" y="363" font-size="9" fill="#c62828">match_prefix_from → get_pages_by_tokens → Host L2 → GPU L1 → resume</text>

  <!-- PP0 Replication arrows (clean horizontal through gap x=700~900) -->
  <!-- Forward: DP0/PP0 → DP1/PP0 -->
  <line x1="700" y1="253" x2="900" y2="253" stroke="#e65100" stroke-width="3" marker-end="url(#arr-o)" stroke-dasharray="8 4"/>
  <rect x="730" y="240" width="140" height="15" rx="3" fill="white" stroke="none"/>
  <text x="800" y="251" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">KV backup (TCP)</text>

  <!-- Ring back: DP1/PP0 → DP0/PP0 -->
  <line x1="900" y1="289" x2="700" y2="289" stroke="#ef6c00" stroke-width="2" marker-end="url(#arr-ob)" stroke-dasharray="4 4" opacity="0.5"/>
  <rect x="740" y="279" width="120" height="13" rx="3" fill="white" stroke="none"/>
  <text x="800" y="289" text-anchor="middle" font-size="8" fill="#ef6c00" opacity="0.7">ring back</text>

  <!-- ============================================================ -->
  <!-- Pipeline arrows: PP0 → PP1 (vertical)                       -->
  <!-- ============================================================ -->
  <line x1="370" y1="380" x2="370" y2="420" stroke="#757575" stroke-width="2" marker-end="url(#arr-g)" stroke-dasharray="6 3"/>
  <text x="390" y="404" font-size="9" fill="#757575">pipeline</text>

  <line x1="1230" y1="380" x2="1230" y2="420" stroke="#757575" stroke-width="2" marker-end="url(#arr-g)" stroke-dasharray="6 3"/>
  <text x="1250" y="404" font-size="9" fill="#757575">pipeline</text>

  <!-- ============================================================ -->
  <!-- PP1 ROW: y=420 to y=655                                     -->
  <!-- ============================================================ -->

  <!-- DP0 / PP1 — Stage (0,1,0) -->
  <rect x="40" y="420" width="660" height="235" rx="8" fill="#fafafa" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="40" y="420" width="660" height="22" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="370" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Stage (0,1,0) — scheduler_DP0_PP1 (last PP: CheckpointUpdateReq)</text>

  <rect x="55" y="450" width="630" height="26" rx="4" fill="#dcedc8" stroke="#558b2f" stroke-width="1"/>
  <text x="370" y="468" text-anchor="middle" font-size="10" fill="#33691e">L1: GPU VRAM (KV Pool)  →  L2: Host DRAM (HiCache backup_thread)</text>

  <rect x="55" y="484" width="630" height="22" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="370" y="499" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">DecodeKVReplicator: on_decode_step → flush_page → GPU DMA → write_storage</text>

  <rect x="55" y="514" width="630" height="28" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="370" y="533" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">SEND ▸  PeerCacheClient → TCP → Stage(1,1,0) :29003</text>

  <rect x="55" y="550" width="630" height="28" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="370" y="569" text-anchor="middle" font-size="10" fill="#e65100">RECV ◂  PeerCacheServer :29001 ← Stage(1,1,0)  |  PeerRadixBuffer</text>

  <text x="370" y="597" text-anchor="middle" font-size="9" fill="#757575" font-family="Courier New, monospace">shard_rank=(0×2+1)×1+0=1 | port=29001</text>

  <rect x="55" y="609" width="630" height="36" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="0.5"/>
  <text x="65" y="624" font-size="9" fill="#f57f17" font-weight="bold">Last PP stage: maybe_send_checkpoint_updates() → CheckpointUpdateReq → DPC</text>
  <text x="65" y="638" font-size="9" fill="#f57f17">DPC tracks checkpointed_output_len per request for failover boundary</text>

  <!-- DP1 / PP1 — Stage (1,1,0) -->
  <rect x="900" y="420" width="660" height="235" rx="8" fill="#fafafa" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="900" y="420" width="660" height="22" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1230" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Stage (1,1,0) — scheduler_DP1_PP1 (last PP: CheckpointUpdateReq)</text>

  <rect x="915" y="450" width="630" height="26" rx="4" fill="#dcedc8" stroke="#558b2f" stroke-width="1"/>
  <text x="1230" y="468" text-anchor="middle" font-size="10" fill="#33691e">L1: GPU VRAM (KV Pool)  →  L2: Host DRAM (HiCache backup_thread)</text>

  <rect x="915" y="484" width="630" height="22" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="1230" y="499" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">DecodeKVReplicator: on_decode_step → flush_page → GPU DMA → write_storage</text>

  <rect x="915" y="514" width="630" height="28" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="1230" y="533" text-anchor="middle" font-size="10" font-weight="bold" fill="#bf360c">SEND ▸  PeerCacheClient → TCP → Stage(0,1,0) :29001</text>

  <rect x="915" y="550" width="630" height="28" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="1230" y="569" text-anchor="middle" font-size="10" fill="#e65100">RECV ◂  PeerCacheServer :29003 ← Stage(0,1,0)  |  PeerRadixBuffer</text>

  <text x="1230" y="597" text-anchor="middle" font-size="9" fill="#757575" font-family="Courier New, monospace">shard_rank=(1×2+1)×1+0=3 | port=29003</text>

  <rect x="915" y="609" width="630" height="36" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="0.5"/>
  <text x="925" y="624" font-size="9" fill="#c62828" font-weight="bold">On DP0 failover: prefetch DP0/PP1 KV from local PeerRadixBuffer</text>
  <text x="925" y="638" font-size="9" fill="#c62828">match_prefix_from → get_pages_by_tokens → Host L2 → GPU L1 → resume</text>

  <!-- PP1 Replication arrows (clean horizontal through gap) -->
  <!-- Forward: DP0/PP1 → DP1/PP1 -->
  <line x1="700" y1="528" x2="900" y2="528" stroke="#e65100" stroke-width="3" marker-end="url(#arr-o)" stroke-dasharray="8 4"/>
  <rect x="730" y="515" width="140" height="15" rx="3" fill="white" stroke="none"/>
  <text x="800" y="526" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">KV backup (TCP)</text>

  <!-- Ring back: DP1/PP1 → DP0/PP1 -->
  <line x1="900" y1="564" x2="700" y2="564" stroke="#ef6c00" stroke-width="2" marker-end="url(#arr-ob)" stroke-dasharray="4 4" opacity="0.5"/>
  <rect x="740" y="554" width="120" height="13" rx="3" fill="white" stroke="none"/>
  <text x="800" y="564" text-anchor="middle" font-size="8" fill="#ef6c00" opacity="0.7">ring back</text>

  <!-- ============================================================ -->
  <!-- Failover Summary                                             -->
  <!-- ============================================================ -->
  <rect x="40" y="676" width="1520" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="52" y="694" font-size="12" font-weight="bold" fill="#f57f17">Failover: DP0 crashes → DPC resumes on DP1</text>

  <rect x="52" y="702" width="170" height="32" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="137" y="722" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">1. Detect DP0 exit</text>

  <line x1="222" y1="718" x2="250" y2="718" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="252" y="702" width="200" height="32" rx="4" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="352" y="722" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">2. ResumeGenerateReq</text>

  <line x1="452" y1="718" x2="480" y2="718" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <rect x="482" y="702" width="200" height="32" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="582" y="722" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">3. Backup resumes</text>

  <line x1="682" y1="718" x2="710" y2="718" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="712" y="702" width="230" height="32" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="827" y="722" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">4. Prefetch PeerRadixBuffer</text>

  <line x1="942" y1="718" x2="970" y2="718" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-gn)"/>

  <rect x="972" y="702" width="170" height="32" rx="4" fill="#dcedc8" stroke="#558b2f" stroke-width="1"/>
  <text x="1057" y="722" text-anchor="middle" font-size="9" font-weight="bold" fill="#33691e">5. Resume output</text>

  <rect x="1170" y="702" width="370" height="32" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="1180" y="722" font-size="9" fill="#424242">Policy: <tspan font-weight="bold" fill="#2e7d32">wait_complete</tspan> | <tspan font-weight="bold" fill="#1565c0">best_effort</tspan> | <tspan font-weight="bold" fill="#ef6c00">timeout</tspan></text>

  <!-- ============================================================ -->
  <!-- Legend                                                        -->
  <!-- ============================================================ -->
  <rect x="40" y="762" width="1520" height="44" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="52" y="778" font-size="10" font-weight="bold" fill="#424242">Legend:</text>

  <rect x="110" y="770" width="14" height="12" rx="2" fill="#dcedc8" stroke="#558b2f"/>
  <text x="130" y="781" font-size="9" fill="#424242">L1/L2 (0.5.9 base)</text>
  <rect x="260" y="770" width="14" height="12" rx="2" fill="#bbdefb" stroke="#1565c0"/>
  <text x="280" y="781" font-size="9" font-weight="bold" fill="#1565c0">DecodeKVReplicator (NEW)</text>
  <rect x="460" y="770" width="14" height="12" rx="2" fill="#ffe0b2" stroke="#e65100"/>
  <text x="480" y="781" font-size="9" font-weight="bold" fill="#e65100">SEND: PeerCacheClient (NEW)</text>
  <rect x="680" y="770" width="14" height="12" rx="2" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="700" y="781" font-size="9" fill="#e65100">RECV: PeerCacheServer + Buffer (NEW)</text>

  <text x="52" y="798" font-size="9" fill="#424242">Arrows:</text>
  <line x1="100" y1="795" x2="160" y2="795" stroke="#e65100" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="168" y="799" font-size="9" font-weight="bold" fill="#e65100">KV backup (forward)</text>
  <line x1="310" y1="795" x2="370" y2="795" stroke="#ef6c00" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="378" y="799" font-size="9" fill="#ef6c00">ring back</text>
  <line x1="460" y1="795" x2="520" y2="795" stroke="#757575" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="528" y="799" font-size="9" fill="#757575">PP pipeline</text>
  <line x1="630" y1="795" x2="690" y2="795" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="698" y="799" font-size="9" fill="#7b1fa2">dispatch / failover</text>

  <!-- Key principle -->
  <text x="800" y="830" text-anchor="middle" font-size="10" fill="#616161">Rule: backup_dp = (dp+1) % dp_size, same pp_rank, same tp_rank  |  Port: peer_port = 29000 + (dp×PP_SIZE + pp)×TP_SIZE + tp  |  Transport: full_token_ids (not hash keys)</text>

  <!-- TCP protocol -->
  <rect x="40" y="846" width="1520" height="28" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="52" y="864" font-size="9" fill="#bf360c" font-family="Courier New, monospace">TCP CMD_PUT_TOKENS(4): [cmd:1B][seq_len:4B][page_start:4B][page_count:4B][tokens:seq_len×4B LE][per-page: data_len:4B+data] → Resp: [status:1B][count:4B][success:bool×count]</text>
</svg>