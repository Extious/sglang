# Heavy Swarm Configuration
# All parameters can also be overridden by environment variables.
# Environment variables take precedence over this config file.

# --- Model ---
model_name: "openai/Qwen/Qwen3-4B-Instruct-2507"
model_max_tokens: 32768

# --- Router / LLM endpoint ---
router_host: "127.0.0.1"
router_port: "30000"
llm_base_url: ""          # auto-derived from router_host:router_port if empty
llm_api_key: ""           # falls back to OPENAI_API_KEY / OPENROUTER_API_KEY / "sk-local"

# --- Task execution ---
task_processes: 6          # number of parallel processes
task_limit: 96             # max number of tasks to run
task_start_offset: 0       # skip the first N tasks
tasks_file: ""             # path to tasks file; empty = default tasks.txt

# --- HeavySwarm constructor ---
swarm_name: "Research Team"
swarm_description: "Multi-agent analysis system"
swarm_timeout: 300
swarm_aggregation_strategy: "synthesis"
swarm_loops_per_agent: 1
swarm_max_loops: 1
swarm_max_workers: 4
swarm_show_dashboard: false
swarm_streaming_on: true
swarm_agent_prints_on: false
swarm_output_type: "dict-all-except-first"
swarm_random_loops_per_agent: false
swarm_verbose: false

# --- Per-agent max output tokens ---
agent_max_tokens:
  question: 32768
  research: 32768
  analysis: 32768
  alternatives: 32768
  verification: 32768
  synthesis: 32768

# --- Reporting ---
enable_timing_reports: true
results_path: ""           # path to write results JSON; empty = skip
summary_csv_for_plot: ""   # path to existing summary CSV for re-plotting only

# --- Timing output directory ---
# Empty means default: <script_dir>/agent_workspace/timing_reports/
timing_output_dir: ""
